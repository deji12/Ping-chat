{% extends 'user/auth/base.html' %}
{% block content %}

  <div class="d-flex align-items-center gap-3 mb-4">
    <div class="p-2 rounded-3 d-inline-flex align-items-center justify-content-center" style="width: 44px; height: 44px; background: rgba(94, 106, 210, 0.12); border: 1px solid rgba(94, 106, 210, 0.3); color: #5E6AD2;">
      <i class="bi bi-key-fill fs-4"></i>
    </div>
    <div>
      <h2 class="h4 mb-0 fw-semibold" style="color: var(--foreground); letter-spacing: -0.02em;">Reset password</h2>
      <p class="small mb-0" style="color: var(--foreground-muted);">Enter your new password</p>
    </div>
  </div>

  <!-- Reset Form -->
  <form id="resetForm" method="POST">
    {% csrf_token %}
    <div class="mb-4">
      <label class="form-label"><i class="bi bi-lock-fill me-1"></i> New password</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
    </div>

    <div class="mb-4">
      <label class="form-label"><i class="bi bi-shield-check me-1"></i> Confirm password</label>
      <input type="password" class="form-control" id="confirmPassword" name="confirm_password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2">
      <i class="bi bi-send me-2"></i> Reset Password
    </button>

    <div class="text-center mt-4 pt-2">
      <p class="mb-0 small">
        <a href="{% url 'login_user' %}" id="backToLoginLink" class="fw-semibold" style="color: var(--accent);">← Back to sign in</a>
      </p>
    </div>
  </form>

{% endblock content %}
