<div class="d-flex justify-content-center mb-4">
  <div class="p-3 rounded-4 d-inline-flex align-items-center justify-content-center" style="width: 64px; height: 64px; background: rgba(94, 106, 210, 0.12); border: 1px solid rgba(94, 106, 210, 0.35); color: #5E6AD2; box-shadow: 0 0 24px rgba(94, 106, 210, 0.2);">
    <i class="bi bi-envelope-check-fill fs-2"></i>
  </div>
</div>

<h2 class="h4 mb-2 fw-semibold text-center" style="color: var(--foreground); letter-spacing: -0.02em;">Check your inbox</h2>
<p class="text-center mb-4 small" style="color: var(--foreground-muted);">
  We've sent a password reset link to <strong id="emailDisplay" style="color: var(--foreground);">your email</strong>.<br>
  Click the link to create a new password.
</p>

<div class="d-flex align-items-center gap-2 mb-4 p-3 rounded-3" style="background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: #34d399;">
  <i class="bi bi-clock-history"></i>
  <span class="small">The link expires in 10 minutes.</span>
</div>

<a href="{% url 'login_user' %}" class="btn btn-primary w-100 py-2">
  <i class="bi bi-arrow-left me-2"></i> Back to sign in
</a>
