<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ping · authentication</title>

  <!-- Bootstrap 5 + Icons + Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <!-- Ambient Multi-layer Background System -->
  <div class="ambient-glow primary-glow"></div>
  <div class="ambient-glow secondary-glow"></div>
  <div class="grid-overlay"></div>

  <div class="d-flex align-items-center justify-content-center min-vh-100 py-4 py-md-5" style="position: relative; z-index: 1;">
    <div class="container" style="max-width: 520px;">
      <div class="auth-card p-4 p-md-5">
        
        <!-- Header with logo & brand -->
        <div class="text-center mb-4">
          <div class="d-flex justify-content-center mb-3">
            <div class="icon-circle" style="width: 56px; height: 56px; border-radius: 14px; background: rgba(94, 106, 210, 0.12); border: 1px solid rgba(94, 106, 210, 0.35); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(94, 106, 210, 0.25);">
              <i class="bi bi-chat-dots-fill" style="font-size: 1.8rem; color: #5E6AD2;"></i>
            </div>
          </div>
          <h1 class="display-6 fw-bold mb-1">
            <span style="font-weight: 700; letter-spacing: -0.03em; background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.75) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Ping</span>
          </h1>
          <p class="small mb-0" style="color: var(--foreground-muted); letter-spacing: 0.04em;">Real‑time chat · Connect instantly</p>
        </div>

        <div class="position-relative mx-auto mb-4" style="width: 64px; height: 2px; background: linear-gradient(90deg, transparent, rgba(94, 106, 210, 0.6), transparent); border-radius: 2px;">
        </div>

        <!-- Alert messages -->
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert" style="background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid {% if message.tags == 'error' %}rgba(244,63,94,0.3){% else %}rgba(16,185,129,0.3){% endif %}; color: var(--foreground); border-radius: var(--radius-md);">
              <b>{{ message }}</b>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}

        {% block content %} 

        {% endblock content %}

      </div>
    </div>
  </div>

  <style>
    body {
      padding-top: 0 !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
